# Nginx Configuration for FUUDELIVERY Production
# Hardened with Security Headers, Rate Limiting and SSL

# Rate Limiting Zones (Prevenção de DDoS/Brute-force)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m; # Mais restrito para login
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    
    # Redirecionar todo HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com api.seu-dominio.com;

    # SSL Configuration (Moderno e Seguro)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Cipher suites modernos (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (Forçar HTTPS no navegador)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Root para arquivos estáticos (Apps Svelte/Bootstrap)
    root /var/www/html/apps;
    index index.html;

    # Logs
    access_log /var/log/nginx/fuud_access.log;
    error_log /var/log/nginx/fuud_error.log warn;

    # Segurança: Esconder versão do Nginx
    server_tokens off;

    # Headers de Segurança (XSS, Clickjacking, MIME-sniffing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.mercadopago.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.r2.cloudflarestorage.com; connect-src 'self' https://api.mercadopago.com wss:; frame-src https://www.mercadopago.com;" always;

    # API Proxy (PHP Backend)
    location /api/ {
        # Rate limiting para API
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://api:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts ajustados para operações longas (ex: upload foto)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Endpoint de Login (Rate Limiting Agressivo)
    location /api/auth/login.php {
        limit_req zone=login_limit burst=3 nodelay;
        
        proxy_pass http://api:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE (Server-Sent Events) para KDS em Tempo Real
    location /api/kds_orders.php {
        proxy_pass http://api:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Configuração crítica para SSE: manter conexão aberta
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 100s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
        
        # Headers para SSE
        add_header 'Content-Type' 'text/event-stream';
        add_header 'Cache-Control' 'no-cache';
        add_header 'Connection' 'keep-alive';
        add_header 'Access-Control-Allow-Origin' '*';
    }

    # Apps Estáticos (PWA Cliente, Tablet, Admin)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache agressivo para assets estáticos (versionados por hash)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(vendor|node_modules|\.git|\.env) {
        deny all;
        return 404;
    }
}
